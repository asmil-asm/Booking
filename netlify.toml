# ============================================
# Netlify Configuration for Vite + React SPA
# ============================================

[build]
  command = "npm run build"
  publish = "dist"

# ============================================
# SPA Redirect — مهم جداً لـ React Router
# ============================================
# يجعل كل الطلبات غير الموجودة ترجع إلى index.html
# بدونه: تحديث الصفحة على /hotels يعطي 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================
# Cache Headers — لتحسين السرعة
# ============================================

# 1. ملفات الأصول المُجزّأة (JS/CSS) — تخزين طويل
#    Vite يضيف hash في اسم الملف، لذا آمن للتخزين سنة كاملة
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2. index.html — لا تخزين (ليرى المستخدم التحديثات فوراً)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 3. mockServiceWorker.js (إن كنت تستخدمه في التطوير)
[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 4. الصور — تخزين أسبوع (يمكن تحديثها)
[[headers]]
  for = "/assets/Home/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/Hotels/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ============================================
# Security Headers — إضافية لكن موصى بها
# ============================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"